<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vietnam Food List · 越南食单</title>
<meta name="theme-color" content="#0B0E0C">
<link rel="icon" href="assets/app.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Newsreader:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script>
  (function(){
    try{
      var s = localStorage.getItem("hn-theme");
      var d = s || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", d);
    }catch(e){ document.documentElement.setAttribute("data-theme","dark"); }
  })();
</script>
</head>
<body class="home">
<canvas id="sky" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>

<header class="topbar">
  <a class="logotype" href="index.html">
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M32 8C32.9 14.2 34.8 16.1 41 17C34.8 17.9 32.9 19.8 32 26C31.1 19.8 29.2 17.9 23 17C29.2 16.1 31.1 14.2 32 8Z" fill="currentColor"/>
      <ellipse cx="32" cy="40" rx="19" ry="5.5" stroke="currentColor" stroke-width="3.2"/>
      <path d="M13 40a19 19 0 0 0 38 0" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
    </svg>
    <span class="lt">越南美食探索</span>
  </a>
  <div class="spacer"></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/>
    </svg>
    <input id="q" type="search" placeholder="搜菜名 / 区域" aria-label="搜索菜名或区域" autocomplete="off">
  </div>
  <button class="iconbtn" id="themeBtn" aria-label="切换主题">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<div class="layout layout-home">
  <main class="stage">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M32 8C32.9 14.2 34.8 16.1 41 17C34.8 17.9 32.9 19.8 32 26C31.1 19.8 29.2 17.9 23 17C29.2 16.1 31.1 14.2 32 8Z" fill="currentColor"/>
        <ellipse cx="32" cy="40" rx="19" ry="5.5" stroke="currentColor" stroke-width="3.2"/>
        <path d="M13 40a19 19 0 0 0 38 0" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="site-title">越南食单</h1>
    <p class="tagline">四星期 · 把这条街吃穿</p>

    <div class="stage-rule"></div>

    <div class="entries">
      <a class="entry" href="plan.html#list">
        <span class="en">食单<em id="eCount">52</em></span>
        <span class="ec">按街区筛，点开看怎么吃</span>
      </a>
      <a class="entry" href="plan.html#routes">
        <span class="en">走法<em id="eRoutes">9</em></span>
        <span class="ec">四条线，一次吃一串</span>
      </a>
      <a class="entry" href="plan.html#album">
        <span class="en">相册</span>
        <span class="ec">你拍的照片都在这儿</span>
      </a>
    </div>

    <nav class="subnav" aria-label="栏目">
      <a href="plan.html#list">食单</a>
      <a href="plan.html#routes">走法</a>
      <a href="plan.html#album">相册</a>
      <a href="plan.html#about">吃之前<span class="k">?</span></a>
    </nav>

    <section class="picks" aria-labelledby="picksTitle">
      <h2 id="picksTitle">今天吃哪样</h2>
      <div class="pick-row" id="picks"></div>
    </section>
  </main>

  <aside class="side">
    <div class="panel">
      <h3>进度</h3>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 80 80" aria-hidden="true">
          <circle class="tr" cx="40" cy="40" r="34"/>
          <circle class="ba" id="ringBar" cx="40" cy="40" r="34"
                  stroke-dasharray="213.63" stroke-dashoffset="213.63"/>
        </svg>
        <div class="ring-num">
          <b id="doneNum">0</b>
          <span>共 <span id="totalNum">52</span> 样</span>
          <span id="daysNum" style="display:block;margin-top:.2rem"></span>
        </div>
      </div>
      <div class="axis">
        <div class="axis-track">
          <i class="axis-fill" id="axisFill"></i>
          <i class="axis-tick" style="left:25%"></i>
          <i class="axis-tick" style="left:50%"></i>
          <i class="axis-tick" style="left:75%"></i>
          <b class="axis-dot" id="axisDot"></b>
        </div>
        <div class="axis-meta">
          <span><b id="axisDone">0</b> 已吃</span>
          <span id="axisTotal">共 0 样</span>
        </div>
      </div>
      <div class="bars" id="bars"></div>
    </div>

    <div class="panel">
      <h3>最近打卡</h3>
      <ul class="recent" id="recent"></ul>
    </div>
  </aside>
</div>

<footer>
  <span>越南美食探索计划</span>
  <span class="fsp"></span>
  <a href="plan.html#about">备份与恢复</a>
  <a href="upload.html">手机传图</a>
  <span id="fTarget"></span>
</footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/home.js"></script>
</body>
</html>
